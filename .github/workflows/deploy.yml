name: Deploy Magma App

on:
  push:
    branches:
      - features_upgrade

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20.12.0'
      
      # - name: Install Yarn
      #   run: npm install -g yarn

      - name: Install dependencies
        run: npm install
        # run: npm install --legacy-peer-deps
        # run: yarn

      - name: Build the project
        run: npm run build
        # run: npm run build:vite

      - name: Deploy to branch
        run: |
          mv dist /tmp/dist_upgraded
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout --orphan deploy-branch-upgraded
          git rm -rf .
          git clean -fdx
          mv /tmp/dist_upgraded/* .
          
          git add -A
          git commit -m "Deploy the branch named features_upgrade"
          
          git push -f origin deploy-branch-upgraded
